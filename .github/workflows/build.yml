# Every push: run all tests, then build the Windows installer and the Android apps from the same commit.
# Downloads: the run's page on GitHub > Artifacts. Every push to main also publishes the Windows installers (Tiffin POS
# and the ODS add-on) as a GitHub Release: DinePOS Cloud's download catalogue offers the newest one in the customer
# portal (fine-dine ADR-0007, P8-03).
name: Build Windows and Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: POS backend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Screens
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Desktop app
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Order hub
        run: node --test --test-concurrency=1 "hub/test/*.test.ts"
      - name: ODS add-on
        working-directory: addons/ods
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Payment machines add-on
        working-directory: addons/edc
        run: |
          npm ci
          npm run typecheck
          npm test

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
        working-directory: ui
      - run: npm ci
        working-directory: desktop
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned until a code-signing certificate is added as a secret
        run: |
          node scripts/build.mjs
          npx electron-builder --win --config electron-builder.config.cjs --publish never
      # The ODS add-on is signed with the vendor's add-on key. Add the private key's PEM text as the repository secret
      # TIFFIN_ADDON_SIGNING_KEY; without it this step is skipped and the release has the POS installer only.
      - name: ODS add-on installer
        shell: bash
        env:
          ADDON_KEY: ${{ secrets.TIFFIN_ADDON_SIGNING_KEY }}
        run: |
          if [ -z "$ADDON_KEY" ]; then
            echo "::warning title=ODS not built::Add the TIFFIN_ADDON_SIGNING_KEY secret to build and publish the ODS installer."
            exit 0
          fi
          npm ci
          (cd addons/ods && npm ci)
          printf '%s\n' "$ADDON_KEY" > "$RUNNER_TEMP/addon-signing.pem"
          (cd addons/ods && POS_ADDON_SIGNING_KEY="$RUNNER_TEMP/addon-signing.pem" npm run installer)
          rm -f "$RUNNER_TEMP/addon-signing.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: TiffinPOS-Windows
          path: |
            desktop/release/*.exe
            addons/dist/installers/TiffinPOS-ODS-Setup-*.exe
      - name: Build Tiffin Data Manager installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node scripts/build-manager.mjs
          npx electron-builder --win --config electron-builder.manager.cjs --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TiffinDataManager-Windows
          path: desktop/release-manager/*.exe
          if-no-files-found: error

  android:
    name: Android apps
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build screens
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: actions/cache@v4
        with:
          path: android/.cache
          key: node-runtime-${{ hashFiles('android/node-runtime.json') }}
      - name: Node runtime and POS files (pinned, checksum-checked)
        run: node android/scripts/prepare.ts
      - name: Build APKs (signed release when the signing key secrets are set, else debug)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.POS_ANDROID_KEYSTORE_B64 }}
          POS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.POS_ANDROID_KEYSTORE_PASSWORD }}
          POS_ANDROID_KEY_ALIAS: ${{ secrets.POS_ANDROID_KEY_ALIAS }}
          POS_ANDROID_KEY_PASSWORD: ${{ secrets.POS_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            POS_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease --console=plain
            rm -f "$RUNNER_TEMP/release.jks"
          else
            ./gradlew assembleDebug --console=plain
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: TiffinPOS-Android
          path: android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error

  release:
    name: Release
    # Pushes to main only (never pull requests): one release per build, marked latest.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TiffinPOS-Windows
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=$(find out -name '*.exe' | sort)
          version=$(basename "$(find out -name 'TiffinPOS-Setup-*.exe' | head -1)" .exe | sed 's/^TiffinPOS-Setup-//')
          tag="tiffin-build-${{ github.run_number }}"
          notes="Tiffin POS ${version}, build ${{ github.run_number }} from ${GITHUB_SHA::7}. Windows installers are not code-signed yet: Windows SmartScreen may warn."
          gh release create "$tag" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tiffin POS ${version} (build ${{ github.run_number }})" --notes "$notes" --latest
